<!doctype html>
<!-- Prueba del servidor en el navegador: SQLite (sql.js) hace de D1 y se simulan push y Gemini.
     Uso: servir la carpeta turbo/ (python -m http.server 8788 --directory turbo) y abrir /tools/worker-test.html -->
<meta charset="utf-8">
<title>Turbo worker test</title>
<body style="font:14px monospace;background:#111;color:#ddd;padding:16px">
<pre id="out">Corriendo…</pre>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<script type="module">
const out = document.getElementById('out');
const lines = [];
let failures = 0;
const log = (ok, name, extra = '') => { if (!ok) failures++; lines.push(`${ok ? 'PASS' : 'FAIL'}  ${name} ${extra}`); out.textContent = lines.join('\n'); };

const SQL = await initSqlJs({ locateFile: f => `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${f}` });
const db = new SQL.Database();

class Stmt {
  constructor(sql, params = []) { this.sql = sql; this.params = params; }
  bind(...p) { return new Stmt(this.sql, p); }
  rows() { const st = db.prepare(this.sql); st.bind(this.params); const r = []; while (st.step()) r.push(st.getAsObject()); st.free(); return r; }
  async first() { return this.rows()[0] ?? null; }
  async all() { return { results: this.rows() }; }
  async run() { db.run(this.sql, this.params); return { success: true }; }
}
const DB = { prepare: sql => new Stmt(sql), batch: async list => { for (const s of list) await s.run(); return []; } };

const pushes = [];
let geminiReply = null;
const realFetch = window.fetch;
window.fetch = async (url, init) => {
  const u = String(url);
  if (u.startsWith('https://push.test/')) { pushes.push({ url: u, init }); return new Response('', { status: 201 }); }
  if (u.includes('generativelanguage.googleapis.com')) {
    return new Response(JSON.stringify({ candidates: [{ content: { parts: [{ text: JSON.stringify(geminiReply) }] } }] }), { status: 200 });
  }
  return realFetch(url, init);
};

const worker = (await import('/src/worker.js')).default;
const env = { DB, APP_SECRET: 'secreto', ASSETS: { fetch: () => new Response('asset') } };
const req = (method, path, body, auth = true) => worker.fetch(new Request(`https://turbo.test/api/${path}`, {
  method, headers: { 'Content-Type': 'application/json', ...(auth ? { Authorization: 'Bearer secreto' } : {}) }, body: body ? JSON.stringify(body) : undefined,
}), env);

let r = await req('GET', 'ping', null, false);
log(r.status === 401, 'sin clave → 401', r.status);
r = await req('GET', 'ping');
let j = await r.json();
log(r.ok && j.ok && j.ai === false, 'ping con clave', JSON.stringify(j));

r = await req('PUT', 'state', { updatedAt: 100, state: { tasks: [1] } });
log(r.ok, 'guardar respaldo');
j = await (await req('GET', 'state')).json();
log(j.updatedAt === 100 && j.state.tasks[0] === 1, 'leer respaldo');
r = await req('PUT', 'state', { updatedAt: 50, state: {} });
log(r.status === 409, 'no pisa con versión vieja', r.status);

j = await (await req('GET', 'push/key')).json();
log(j.key && j.key.length === 87, 'clave VAPID pública', j.key?.length);
const pubKey = j.key;

r = await req('POST', 'push/subscribe', { endpoint: 'https://push.test/abc', keys: {} });
log(r.ok, 'suscribir dispositivo');

const now = Date.now();
r = await req('PUT', 'reminders', { reminders: [
  { id: 'a', at: now - 1000, title: 'Ya toca', body: 'b1' },
  { id: 'b', at: now + 3600000, title: 'Después', body: 'b2' },
  { id: 'old', at: now - 3600000, title: 'Muy viejo', body: '' },
] });
log(r.ok, 'guardar recordatorios');

let waits = [];
await worker.scheduled({}, env, { waitUntil: p => waits.push(p) });
await Promise.all(waits);
log(pushes.length === 1, 'cron manda 1 push', pushes.length);

const auth = pushes[0]?.init.headers.Authorization || '';
const m = auth.match(/^vapid t=([^.]+)\.([^.]+)\.([^,]+), k=(.+)$/);
if (m) {
  const b64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', b64(m[4]), { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
  const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, b64(m[3]), new TextEncoder().encode(`${m[1]}.${m[2]}`));
  const payload = JSON.parse(new TextDecoder().decode(b64(m[2])));
  log(ok, 'firma VAPID válida');
  log(m[4] === pubKey && payload.aud === 'https://push.test' && payload.sub === 'https://turbo.test', 'JWT con aud/sub correctos', JSON.stringify(payload));
} else log(false, 'header Authorization', auth);

j = await (await worker.fetch(new Request('https://turbo.test/api/push/pending?endpoint=' + encodeURIComponent('https://push.test/abc')), env)).json();
log(j.messages.length === 1 && j.messages[0].title === 'Ya toca', 'buzón entrega el mensaje (y no el viejo)', JSON.stringify(j.messages));
j = await (await worker.fetch(new Request('https://turbo.test/api/push/pending?endpoint=' + encodeURIComponent('https://push.test/abc')), env)).json();
log(j.messages.length === 0, 'buzón queda vacío');

waits = [];
await worker.scheduled({}, env, { waitUntil: p => waits.push(p) });
await Promise.all(waits);
log(pushes.length === 1, 'cron no repite recordatorios enviados', pushes.length);

r = await req('PUT', 'reminders', { reminders: [{ id: 'a', at: now - 1000, title: 'Ya toca', body: 'b1' }] });
waits = [];
await worker.scheduled({}, env, { waitUntil: p => waits.push(p) });
await Promise.all(waits);
log(pushes.length === 1, 're-sincronizar no reenvía uno ya mandado', pushes.length);

r = await req('POST', 'ai/capture', { text: 'algo', today: 'hoy' });
log(r.status === 503, 'IA sin clave → 503', r.status);
env.GEMINI_API_KEY = 'x';
geminiReply = { tasks: [{ title: 'Estudiar finanzas', area: 'estudios', minutes: 47, due: '2026-09-25' }, { title: 'Algo raro', area: 'marte', minutes: 999, due: 'viernes' }] };
j = await (await req('POST', 'ai/capture', { text: 'estudiar finanzas el viernes', today: 'hoy' })).json();
log(j.tasks[0].minutes === 45 && j.tasks[0].due === '2026-09-25' && j.tasks[1].area === 'personal' && j.tasks[1].minutes === 240 && j.tasks[1].due === null, 'IA: normaliza tareas', JSON.stringify(j.tasks));
geminiReply = { steps: [{ text: 'Abrir el PDF', min: 1 }, { text: 'Leer la página 1', min: 5 }] };
j = await (await req('POST', 'ai/steps', { title: 'Estudiar', area: 'estudios', minutes: 30 })).json();
log(j.steps.length === 2 && j.steps[0].text === 'Abrir el PDF', 'IA: pasos');

j = await (await req('POST', 'push/test')).json();
log(j.devices === 1 && pushes.length === 2, 'notificación de prueba');

r = await worker.fetch(new Request('https://turbo.test/'), env);
log((await r.text()) === 'asset', 'rutas normales van a la app');

// ---- Fase 2 ----
geminiReply = { sessions: [{ title: 'Ver qué entra' }, { title: 'Estudiar unidad 3' }, { title: 'Repaso' }] };
j = await (await req('POST', 'ai/studyplan', { course: 'Finanzas', kind: 'prueba', title: 'P2', sessions: 3 })).json();
log(j.sessions?.length === 3 && j.sessions[0] === 'Ver qué entra', 'IA: plan de estudio', JSON.stringify(j.sessions));

const share = (method, path, token, body) => worker.fetch(new Request(`https://turbo.test/api/${path}`, {
  method, headers: { 'Content-Type': 'application/json', 'X-Share-Token': token }, body: body ? JSON.stringify(body) : undefined,
}), env);
const TOKEN = 'a'.repeat(36);
r = await share('GET', 'share/view', TOKEN);
log(r.status === 404, 'pareja: sin link activo → 404', r.status);
r = await req('POST', 'share/enable', { token: 'corto' });
log(r.status === 400, 'pareja: token inválido rechazado', r.status);
r = await req('POST', 'share/enable', { token: TOKEN });
await req('PUT', 'share/summary', { summary: { level: 3, tasksDone: 5 } });
j = await (await share('GET', 'share/view', TOKEN)).json();
log(j.summary?.tasksDone === 5, 'pareja: ve el resumen con su token');
r = await share('GET', 'share/view', 'b'.repeat(36));
log(r.status === 404, 'pareja: token equivocado → 404', r.status);
const before = pushes.length;
r = await share('POST', 'share/cheer', TOKEN, { from: 'Polola', msg: '¡Vamos! 💪' });
log(r.ok && pushes.length === before + 1, 'pareja: ánimo manda notificación', r.status);
j = await (await worker.fetch(new Request('https://turbo.test/api/push/pending?endpoint=' + encodeURIComponent('https://push.test/abc')), env)).json();
log(j.messages.some(m => m.title === '💌 Polola' && m.body === '¡Vamos! 💪'), 'pareja: notificación con el mensaje', JSON.stringify(j.messages));
j = await (await req('GET', 'cheers')).json();
log(j.cheers.length === 1 && j.cheers[0].from === 'Polola', 'app lee los mensajes de ánimo');
r = await share('POST', 'share/cheer', TOKEN, { msg: '   ' });
log(r.status === 400, 'pareja: mensaje vacío rechazado', r.status);
await req('POST', 'share/disable');
r = await share('GET', 'share/view', TOKEN);
log(r.status === 404, 'pareja: link desactivado → 404', r.status);

// ---- Fase 3 ----
geminiReply = { reply: 'Anotado', actions: [{ type: 'add_task', title: 'Pagar la luz' }, { type: 'volar', title: 'x' }] };
j = await (await req('POST', 'ai/assistant', { messages: [{ role: 'user', text: 'pagar la luz' }], context: { hoy: 'viernes' } })).json();
log(j.reply === 'Anotado' && j.actions.length === 1 && j.actions[0].type === 'add_task', 'secretaria: filtra acciones inválidas', JSON.stringify(j));
geminiReply = { tasks: [{ title: 'Actualizar CV', minutes: 90, day: 9 }] };
j = await (await req('POST', 'ai/goalweek', { goal: { title: 'Pega' } })).json();
log(j.tasks[0].minutes === 60 && j.tasks[0].day === 6, 'metas: normaliza minutos y día', JSON.stringify(j.tasks));
geminiReply = { highlights: ['a', 'b'], insight: 'i', priorities: ['1', '2', '3', '4'], message: 'm' };
j = await (await req('POST', 'ai/review', { stats: {}, answers: {} })).json();
log(j.priorities.length === 3 && j.insight === 'i', 'revisión semanal');

// Calendario: exportar
const CAL = 'c'.repeat(36);
r = await worker.fetch(new Request(`https://turbo.test/api/calendar/${CAL}.ics`), env);
log(r.status === 404, 'calendario: sin activar → 404', r.status);
await req('POST', 'calendar/enable', { token: CAL });
await req('PUT', 'state', { updatedAt: 999, state: {
  schedule: [{ id: 's1', title: 'Clases', kind: 'clase', days: [2, 3], start: '08:30', end: '11:30' }, { id: 's2', title: 'Dentista, control', kind: 'otro', days: [], date: '2026-09-28', start: '17:00', end: '18:00' }],
  exams: [{ id: 'e1', title: 'Prueba 2', date: '2026-09-30', courseId: 'c1' }], courses: [{ id: 'c1', name: 'Finanzas' }],
  tasks: [{ id: 't1', title: 'Pagar la luz', due: '2026-09-26', done: false }, { id: 't2', title: 'Hecha', due: '2026-09-26', done: true }],
} });
r = await worker.fetch(new Request(`https://turbo.test/api/calendar/${CAL}.ics`), env);
const ics = await r.text();
log(r.ok && r.headers.get('content-type').startsWith('text/calendar'), 'calendario: responde .ics');
log(ics.includes('RRULE:FREQ=WEEKLY;BYDAY=TU,WE') && ics.includes('T083000'), 'calendario: clases semanales');
log(ics.includes('SUMMARY:📌 Dentista\\, control') && ics.includes('DTSTART:20260928T170000'), 'calendario: evento de una vez (con coma escapada)');
log(ics.includes('📚 Prueba 2 (Finanzas)') && ics.includes('DTSTART;VALUE=DATE:20260930'), 'calendario: prueba de día completo');
log(ics.includes('☐ Pagar la luz') && !ics.includes('Hecha'), 'calendario: tareas pendientes (no las hechas)');

// Calendario: importar desde Google
const today = new Date();
const ymd = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
const plus = n => { const d = new Date(today); d.setDate(d.getDate() + n); return d; };
const googleIcs = ['BEGIN:VCALENDAR', 'VERSION:2.0',
  'BEGIN:VEVENT', 'UID:a1', `DTSTART;TZID=America/Santiago:${ymd(plus(1))}T170000`, `DTEND;TZID=America/Santiago:${ymd(plus(1))}T180000`, 'SUMMARY:Dentista', 'END:VEVENT',
  'BEGIN:VEVENT', 'UID:a2', `DTSTART:${ymd(plus(2))}T150000Z`, `DTEND:${ymd(plus(2))}T160000Z`, 'SUMMARY:Llamada (UTC)', 'END:VEVENT',
  'BEGIN:VEVENT', 'UID:a3', `DTSTART;VALUE=DATE:${ymd(plus(3))}`, `DTEND;VALUE=DATE:${ymd(plus(4))}`, 'SUMMARY:Cumple de la polola', 'END:VEVENT',
  'BEGIN:VEVENT', 'UID:a4', `DTSTART;TZID=America/Santiago:${ymd(plus(0))}T190000`, `DTEND;TZID=America/Santiago:${ymd(plus(0))}T203000`,
  'RRULE:FREQ=DAILY;COUNT=5', `EXDATE;TZID=America/Santiago:${ymd(plus(2))}T190000`, 'SUMMARY:Gym diario', 'END:VEVENT',
  'BEGIN:VEVENT', 'UID:a5', `DTSTART:${ymd(plus(1))}T120000`, 'STATUS:CANCELLED', 'SUMMARY:Cancelado', 'END:VEVENT',
  'END:VCALENDAR'].join('\r\n');
const fetchBefore = window.fetch;
window.fetch = async (url, init) => String(url) === 'https://ics.test/basic.ics' ? new Response(googleIcs, { status: 200 }) : fetchBefore(url, init);
j = await (await req('PUT', 'calendar/import-url', { url: 'webcal://ics.test/basic.ics' })).json();
const byTitle = t => j.events.filter(e => e.title === t);
log(byTitle('Dentista')[0]?.start === '17:00' && byTitle('Dentista')[0]?.end === '18:00', 'importar: evento con hora local', JSON.stringify(byTitle('Dentista')));
const utcStart = byTitle('Llamada (UTC)')[0]?.start;
log(utcStart === '12:00' || utcStart === '11:00', 'importar: hora UTC convertida a Chile', utcStart);
log(byTitle('Cumple de la polola')[0]?.allDay === true, 'importar: evento de día completo');
log(byTitle('Gym diario').length === 4, 'importar: repetición diaria con fecha excluida', byTitle('Gym diario').length);
log(!byTitle('Cancelado').length, 'importar: ignora cancelados');
j = await (await req('GET', 'calendar/import')).json();
log(j.connected && j.events.length >= 7, 'importar: se recuerda el link', j.events.length);
r = await req('PUT', 'calendar/import-url', { url: 'ftp://malo' });
log(r.status === 400, 'importar: link inválido → 400', r.status);
window.fetch = fetchBefore;

lines.push('', failures ? `${failures} FALLARON` : 'TODO OK');
out.textContent = lines.join('\n');
</script>
